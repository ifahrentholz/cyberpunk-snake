name: Deploy to GitHub Pages

# Runs on every push to main and can be re-triggered manually (workflow_dispatch)
# so a redeploy doesn't require an empty commit. The build job re-runs the full
# four-gate suite (test, typecheck, lint, build) even though those gates already
# ran on the feature branch's PR: two branches can each be green on their own and
# still merge into a broken main, and the deploy step has no gate of its own — it
# just publishes whatever artifact it's handed. Skipping the gates here would
# mean a broken main can go live on a public URL without a single check running
# after the merge.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
